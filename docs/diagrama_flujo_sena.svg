<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Flujo de la aplicación Seña</title>
<desc id="desc">Diagrama de los perfiles, captura y entrenamiento de datos, reconocimiento temporal, comparación experimental de fotos y conversación entre computadora y teléfono.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10241c"/><stop offset="1" stop-color="#0b1713"/></linearGradient>
  <linearGradient id="lime" x2="1"><stop stop-color="#c8f36c"/><stop offset="1" stop-color="#a8dd55"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".24"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11" fill="none" stroke="#9db9a6" stroke-width="2"/></marker>
  <marker id="arrowlime" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11" fill="none" stroke="#c8f36c" stroke-width="2"/></marker>
  <style>
    text{font-family:Manrope,'Avenir Next',Arial,sans-serif;fill:#e9f3eb}
    .title{font-size:38px;font-weight:800;letter-spacing:-1px}.sub{font-size:17px;fill:#a7bbb0}
    .lane{fill:#142920;stroke:#294a37;stroke-width:2}.card{fill:#1c3328;stroke:#355b42;stroke-width:2;filter:url(#shadow)}
    .lime{fill:url(#lime);stroke:#d8ff99;stroke-width:1}.teal{fill:#183b38;stroke:#3d8174;stroke-width:2}.orange{fill:#392d1c;stroke:#a97c35;stroke-width:2}
    .head{font-size:19px;font-weight:750}.body{font-size:15px;fill:#c1d1c5}.tiny{font-size:13px;fill:#a9beb0}.pill{font-size:13px;font-weight:700;fill:#22331e}
    .arrow{fill:none;stroke:#9db9a6;stroke-width:3;marker-end:url(#arrow)}.alime{fill:none;stroke:#c8f36c;stroke-width:3;marker-end:url(#arrowlime)}
    .dash{stroke-dasharray:8 8}.label{font-size:14px;font-weight:700;fill:#d4e7d8}
  </style>
</defs>
<rect width="1600" height="1100" fill="url(#bg)"/>
<circle cx="1500" cy="70" r="180" fill="#24492f" opacity=".16"/><circle cx="70" cy="1030" r="220" fill="#173f32" opacity=".18"/>
<text x="70" y="78" class="title">Cómo funciona Seña</text>
<text x="72" y="111" class="sub">De los ejemplos grabados a la comunicación · procesamiento local · siete perfiles con datos independientes</text>
<!-- Lane backgrounds -->
<rect x="55" y="150" width="1490" height="225" rx="24" class="lane"/>
<rect x="55" y="400" width="1490" height="330" rx="24" class="lane"/>
<rect x="55" y="755" width="1490" height="280" rx="24" class="lane"/>
<text x="82" y="184" class="label">A · PREPARAR EL MODELO</text>
<text x="82" y="434" class="label">B · USAR EL RECONOCIMIENTO</text>
<text x="82" y="789" class="label">C · CONVERSAR</text>
<!-- A -->
<rect x="88" y="216" width="210" height="104" rx="17" class="lime"/>
<text x="110" y="250" class="head" fill="#17301e">Elegir perfil</text><text x="110" y="278" class="body" fill="#28422c">LSM · DGS · ASL · JSL</text><text x="110" y="300" class="body" fill="#28422c">CSL · LSF · Libras</text>
<rect x="355" y="216" width="235" height="104" rx="17" class="card"/>
<text x="377" y="250" class="head">Dataset</text><text x="377" y="278" class="body">Grabar tomas completas</text><text x="377" y="300" class="body">Etiquetar y revisar ejemplos</text>
<rect x="650" y="216" width="250" height="104" rx="17" class="card"/>
<text x="672" y="250" class="head">Calidad y procedencia</text><text x="672" y="278" class="body">Landmarks + metadatos</text><text x="672" y="300" class="body">Agrupar sesiones/personas</text>
<rect x="965" y="216" width="235" height="104" rx="17" class="teal"/>
<text x="987" y="250" class="head">Entrenamiento</text><text x="987" y="278" class="body">Modelo temporal por perfil</text><text x="987" y="300" class="body">Validación calibra el rechazo</text>
<rect x="1265" y="216" width="230" height="104" rx="17" class="lime"/>
<text x="1287" y="250" class="head" fill="#17301e">Versión evaluada</text><text x="1287" y="278" class="body" fill="#28422c">Métricas por clase</text><text x="1287" y="300" class="body" fill="#28422c">Activar si pasa criterios</text>
<path d="M298 268H345M590 268H640M900 268H955M1200 268H1255" class="alime"/>
<!-- B input devices -->
<rect x="88" y="468" width="220" height="104" rx="17" class="card"/>
<text x="110" y="502" class="head">Cámara</text><text x="110" y="530" class="body">Computadora o teléfono</text><text x="110" y="552" class="tiny">Teléfono: HTTPS privado</text>
<rect x="365" y="468" width="255" height="104" rx="17" class="card"/>
<text x="387" y="502" class="head">MediaPipe Holistic</text><text x="387" y="530" class="body">Detecta manos, cuerpo y rostro</text><text x="387" y="552" class="tiny">Recupera seguimiento si se pierde</text>
<path d="M308 520H355" class="arrow"/>
<polygon points="730,464 835,520 730,576 625,520" fill="#2f3821" stroke="#b9da67" stroke-width="2"/>
<text x="730" y="515" text-anchor="middle" class="head">¿Captura</text><text x="730" y="539" text-anchor="middle" class="head">suficiente?</text>
<path d="M620 520H625" class="arrow"/>
<path d="M835 520H885" class="arrow"/>
<text x="846" y="505" class="tiny">Sí</text>
<rect x="892" y="458" width="280" height="124" rx="17" class="teal"/>
<text x="914" y="490" class="head">Secuencia temporal</text><text x="914" y="518" class="body">Geometría de dedos y manos</text><text x="914" y="540" class="body">Posición + trayectoria del gesto</text><text x="914" y="562" class="tiny">Mismo preprocesamiento versionado</text>
<path d="M1172 520H1210" class="arrow"/>
<rect x="1218" y="458" width="278" height="124" rx="17" class="card"/>
<text x="1240" y="490" class="head">Modelo y controles</text><text x="1240" y="518" class="body">Confianza + margen + estabilidad</text><text x="1240" y="540" class="body">Forma y movimiento aprendido</text><text x="1240" y="562" class="tiny">Acepta una clase o rechaza</text>
<path d="M730 576V631H495V589" class="arrow dash"/>
<text x="520" y="622" class="tiny">No: ajustar encuadre y volver a observar</text>
<rect x="896" y="621" width="600" height="76" rx="16" class="orange"/>
<text x="922" y="653" class="head">Foto experimental · rama independiente</text><text x="922" y="679" class="body">Una postura estática contra referencias validadas; no reconoce trayectoria ni reemplaza al modelo temporal.</text>
<path d="M1032 582V611" fill="none" stroke="#d5a74b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<!-- Flow A to trained model -->
<path d="M1380 320V390H1080V447" class="alime"/>
<text x="1170" y="383" class="tiny">Modelo activo del perfil</text>
<!-- C -->
<rect x="95" y="830" width="300" height="126" rx="19" class="card"/>
<text x="120" y="866" class="head">Resultado reconocido</text><text x="120" y="896" class="body">Palabra o letra confirmada</text><text x="120" y="920" class="body">Se puede escuchar con voz</text>
<rect x="500" y="830" width="300" height="126" rx="19" class="teal"/>
<text x="525" y="866" class="head">Texto acumulado</text><text x="525" y="896" class="body">Une letras o palabras</text><text x="525" y="920" class="body">Espera una pausa de 4 segundos</text>
<rect x="905" y="830" width="260" height="126" rx="19" class="card"/>
<text x="930" y="866" class="head">Sala temporal</text><text x="930" y="896" class="body">Computadora ↔ teléfono</text><text x="930" y="920" class="body">Mensajes en ambas pantallas</text>
<rect x="1270" y="830" width="220" height="126" rx="19" class="lime"/>
<text x="1294" y="866" class="head" fill="#17301e">Fin de sala</text><text x="1294" y="896" class="body" fill="#28422c">Vence en una hora</text><text x="1294" y="920" class="body" fill="#28422c">Se descarta el historial</text>
<path d="M395 893H490M800 893H895M1165 893H1260" class="arrow"/>
<path d="M1360 582V760H245V820" class="alime"/>
<text x="274" y="752" class="tiny">Si se acepta</text>
<rect x="95" y="982" width="1395" height="34" rx="17" fill="#12251c" stroke="#355b42"/>
<text x="792" y="1005" text-anchor="middle" class="tiny">Privacidad: landmarks y metadatos para el dataset · no se archiva video/audio · foto y mensajes temporales se procesan en memoria</text>
</svg>
