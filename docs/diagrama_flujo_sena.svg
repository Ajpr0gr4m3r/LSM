<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2300" viewBox="0 0 1900 2300" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura y flujo completo del código de Seña</title>
<desc id="desc">Mapa del repositorio Seña: interfaces web y móvil, servidor HTTP, perfiles, captura y dataset, entrenamiento y evaluación, inferencia temporal, foto experimental, conversación, almacenamiento, compatibilidad heredada y pruebas.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f5f5"/></linearGradient>
 <linearGradient id="lime" x2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e4e4e4"/></linearGradient>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".10"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#222222" stroke-width="1.7"/></marker>
 <marker id="arrL" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#111111" stroke-width="1.7"/></marker>
 <style>
 text{font-family:Manrope,'Avenir Next',Arial,sans-serif;fill:#111111}
 .title{font-size:40px;font-weight:800;letter-spacing:-1.2px}.subtitle{font-size:18px;fill:#444444}
 .section{fill:#f1f1f1;stroke:#555555;stroke-width:2}.sectionTitle{font-size:16px;font-weight:800;fill:#111111;letter-spacing:1.1px}
 .card{fill:#ffffff;stroke:#333333;stroke-width:1.7;filter:url(#shadow)}.teal{fill:#e8e8e8;stroke:#555555}.gold{fill:#dddddd;stroke:#333333}.light{fill:url(#lime);stroke:#111111}
 .head{font-size:19px;font-weight:750}.body{font-size:15px;fill:#222222}.small{font-size:13px;fill:#444444}.dark{fill:#111111}
 .line{fill:none;stroke:#333333;stroke-width:2.5;marker-end:url(#arr)}.limeLine{fill:none;stroke:#111111;stroke-width:2.7;marker-end:url(#arrL)}.dashed{stroke-dasharray:8 7}
 .tag{font-size:12px;font-weight:800;fill:#111111;letter-spacing:.5px}.legend{font-size:13px;fill:#333333}
 </style>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<circle cx="1780" cy="70" r="220" fill="#cccccc" opacity=".14"/><circle cx="70" cy="2180" r="200" fill="#cccccc" opacity=".12"/>
<text x="65" y="72" class="title">Seña · arquitectura y flujo del código</text>
<text x="68" y="106" class="subtitle">Mapa del repositorio: quién llama a quién, qué datos circulan y dónde se guardan · perfiles y modelos independientes</text>

<rect x="50" y="140" width="1800" height="235" rx="22" class="section"/><text x="78" y="172" class="sectionTitle">1 · INTERFACES Y PUNTOS DE ENTRADA</text>
<rect x="80" y="190" width="560" height="145" rx="15" class="card"/>
<text x="98" y="219" class="head ">Web de computadora</text>
<text x="98" y="245" class="body ">static/index.html + static/styles.css: vistas y diseño</text>
<text x="98" y="266" class="body ">static/app.js: cámara, captura, reconocimiento, vocabulario</text>
<text x="98" y="287" class="body ">static/studio.js · continuous.js · speech.js · rig.js</text>
<text x="98" y="308" class="body ">static/conversation.js · accounts.js: sala y compatibilidad</text>
<text x="626" y="210" text-anchor="end" class="tag">NAVEGADOR</text>
<rect x="690" y="190" width="440" height="145" rx="15" class="teal"/>
<text x="708" y="219" class="head ">Vista del teléfono</text>
<text x="708" y="245" class="body ">static/phone.html: consentimiento y controles</text>
<text x="708" y="266" class="body ">phone.js: cámara, mensajes, voz y foto opcional</text>
<text x="708" y="287" class="body ">Envía fotogramas por HTTPS a la computadora</text>
<text x="1116" y="210" text-anchor="end" class="tag">MÓVIL</text>
<rect x="1180" y="190" width="590" height="145" rx="15" class="light"/>
<text x="1198" y="219" class="head dark">Arranque y configuración</text>
<text x="1198" y="245" class="body dark">web_app.py → main(): valida argumentos y arranca HTTP</text>
<text x="1198" y="266" class="body dark">Por defecto: localhost:8765, sin inicio de sesión</text>
<text x="1198" y="287" class="body dark">--phone-origin permite enlaces móviles HTTPS privados</text>
<text x="1756" y="210" text-anchor="end" class="tag">PUNTO DE ENTRADA</text>
<path d="M640 260L680 260" class="line"/>
<path d="M1130 260L1170 260" class="line"/>
<rect x="50" y="405" width="1800" height="240" rx="22" class="section"/><text x="78" y="437" class="sectionTitle">2 · SERVIDOR WEB, ESTADO Y PROTECCIONES</text>
<rect x="80" y="455" width="510" height="145" rx="15" class="card"/>
<text x="98" y="484" class="head ">Handler en web_app.py</text>
<text x="98" y="510" class="body ">Recibe peticiones /api/* y sirve static/*</text>
<text x="98" y="531" class="body ">Comprueba JSON, tamaño, origen y sesión</text>
<text x="98" y="552" class="body ">Encamina cámara, dataset, entrenamiento y salas</text>
<rect x="690" y="455" width="500" height="145" rx="15" class="teal"/>
<text x="708" y="484" class="head ">Runtime y Session</text>
<text x="708" y="510" class="body ">Caché de modelos y detector por sesión</text>
<text x="708" y="531" class="body ">Buffers temporales de cuadros y predicciones</text>
<text x="708" y="552" class="body ">Limpia cámaras y salas vencidas</text>
<rect x="1290" y="455" width="480" height="145" rx="15" class="gold"/>
<text x="1308" y="484" class="head ">Servicios conectados</text>
<text x="1308" y="510" class="body ">studio_services.py: versiones y actividad</text>
<text x="1308" y="531" class="body ">admin_auth.py: operaciones administrativas</text>
<text x="1308" y="552" class="body ">accounts.py / team_access.py: modo de equipo heredado</text>
<text x="1756" y="475" text-anchor="end" class="tag">PARTE HEREDADA</text>
<path d="M320 335L320 445" class="line"/>
<path d="M910 335L910 445" class="line"/>
<path d="M590 525L680 525" class="line"/>
<path d="M1190 525L1280 525" class="line"/>
<rect x="50" y="670" width="1800" height="275" rx="22" class="section"/><text x="78" y="702" class="sectionTitle">3 · PERFILES, VOCABULARIO, CAPTURA Y DATASET</text>
<rect x="80" y="725" width="390" height="155" rx="15" class="light"/>
<text x="98" y="754" class="head dark">Perfiles · sign_languages.py</text>
<text x="98" y="780" class="body dark">7 perfiles separados: LSM, DGS, ASL,</text>
<text x="98" y="801" class="body dark">JSL, CSL, LSF y Libras</text>
<text x="98" y="822" class="body dark">Etiquetas de salida ≠ modelos aprendidos</text>
<rect x="520" y="725" width="390" height="155" rx="15" class="card"/>
<text x="538" y="754" class="head ">Configuración · config.py</text>
<text x="538" y="780" class="body ">Longitud de secuencia y dimensiones</text>
<text x="538" y="801" class="body ">Rutas base a ejemplos, modelos y assets</text>
<text x="538" y="822" class="body ">Contrato versionado de captura</text>
<rect x="960" y="725" width="390" height="155" rx="15" class="teal"/>
<text x="978" y="754" class="head ">Captura · app.js / web_app.py</text>
<text x="978" y="780" class="body ">Espera manos/encuadre adecuados</text>
<text x="978" y="801" class="body ">MediaPipe Holistic extrae landmarks</text>
<text x="978" y="822" class="body ">Guarda toma y procedencia; sin video</text>
<rect x="1400" y="725" width="370" height="155" rx="15" class="card"/>
<text x="1418" y="754" class="head ">Dataset · web_dataset.py</text>
<text x="1418" y="780" class="body ">Ejemplos NPZ, vocabulario y borradores</text>
<text x="1418" y="801" class="body ">alphabets.py añade símbolos vacíos</text>
<text x="1418" y="822" class="body ">Las clases requieren ejemplos reales</text>
<path d="M910 600L1150 715" class="line"/>
<path d="M470 800L510 800" class="line"/>
<path d="M910 800L950 800" class="line"/>
<path d="M1350 800L1390 800" class="line"/>
<rect x="50" y="980" width="1800" height="330" rx="22" class="section"/><text x="78" y="1012" class="sectionTitle">4 · ENTRENAMIENTO, VALIDACIÓN Y VERSIONES</text>
<rect x="78" y="1045" width="260" height="170" rx="15" class="card"/>
<text x="96" y="1074" class="head ">Revisión de datos</text>
<text x="96" y="1100" class="body ">dataset_tools.py</text>
<text x="96" y="1121" class="body ">calidad, duplicados, conflictos</text>
<text x="96" y="1142" class="body ">exportar/importar dataset</text>
<rect x="365" y="1045" width="260" height="170" rx="15" class="teal"/>
<text x="383" y="1074" class="head ">Particiones seguras</text>
<text x="383" y="1100" class="body ">validation_protocol.py</text>
<text x="383" y="1121" class="body ">sesión/persona/hash unidos</text>
<text x="383" y="1142" class="body ">reserva de prueba persistente</text>
<rect x="652" y="1045" width="260" height="170" rx="15" class="card"/>
<text x="670" y="1074" class="head ">Características</text>
<text x="670" y="1100" class="body ">recognition_features.py</text>
<text x="670" y="1121" class="body ">motion_features.py</text>
<text x="670" y="1142" class="body ">dedos, cuerpo y trayectoria</text>
<rect x="939" y="1045" width="260" height="170" rx="15" class="teal"/>
<text x="957" y="1074" class="head ">Red temporal</text>
<text x="957" y="1100" class="body ">model.py</text>
<text x="957" y="1121" class="body ">web_train.py</text>
<text x="957" y="1142" class="body ">train.py: flujo de escritorio</text>
<rect x="1226" y="1045" width="260" height="170" rx="15" class="card"/>
<text x="1244" y="1074" class="head ">Estrategias</text>
<text x="1244" y="1100" class="body ">discriminative_learning.py</text>
<text x="1244" y="1121" class="body ">hard examples y contraste</text>
<text x="1244" y="1142" class="body ">variantes sin invertir movimiento</text>
<rect x="1513" y="1045" width="260" height="170" rx="15" class="light"/>
<text x="1531" y="1074" class="head dark">Evaluar / publicar</text>
<text x="1531" y="1100" class="body dark">recognition_analysis.py</text>
<text x="1531" y="1121" class="body dark">matriz, F1 y métricas por clase</text>
<text x="1531" y="1142" class="body dark">modelos/versiones en models/</text>
<path d="M275 880L208 1035" class="limeLine"/>
<path d="M338 1130L355 1130" class="line"/>
<path d="M625 1130L642 1130" class="line"/>
<path d="M912 1130L929 1130" class="line"/>
<path d="M1199 1130L1216 1130" class="line"/>
<path d="M1486 1130L1503 1130" class="line"/>
<path d="M1585 880L1585 1035" class="limeLine"/>
<rect x="50" y="1340" width="1800" height="300" rx="22" class="section"/><text x="78" y="1372" class="sectionTitle">5 · RECONOCIMIENTO EN VIVO Y RECHAZO DE AMBIGÜEDAD</text>
<rect x="80" y="1415" width="260" height="155" rx="15" class="card"/>
<text x="98" y="1444" class="head ">1 · Fotograma</text>
<text x="98" y="1470" class="body ">app.js o phone.js</text>
<text x="98" y="1491" class="body ">cámara seleccionada</text>
<text x="98" y="1512" class="body ">reintento de seguimiento</text>
<rect x="365" y="1415" width="260" height="155" rx="15" class="teal"/>
<text x="383" y="1444" class="head ">2 · Landmarks</text>
<text x="383" y="1470" class="body ">Holistic + capture_quality.py</text>
<text x="383" y="1491" class="body ">valida manos y calidad</text>
<text x="383" y="1512" class="body ">rig visual opcional</text>
<rect x="650" y="1415" width="260" height="155" rx="15" class="card"/>
<text x="668" y="1444" class="head ">3 · Secuencia</text>
<text x="668" y="1470" class="body ">30 cuadros útiles</text>
<text x="668" y="1491" class="body ">features versionadas</text>
<text x="668" y="1512" class="body ">preprocesamiento del bundle</text>
<rect x="935" y="1415" width="260" height="155" rx="15" class="teal"/>
<text x="953" y="1444" class="head ">4 · Predicción</text>
<text x="953" y="1470" class="body ">modelo activo del perfil</text>
<text x="953" y="1491" class="body ">probabilidades por clase</text>
<text x="953" y="1512" class="body ">inferencia temporal</text>
<rect x="1220" y="1415" width="260" height="155" rx="15" class="card"/>
<text x="1238" y="1444" class="head ">5 · Decisión</text>
<text x="1238" y="1470" class="body ">recognition_decision.py</text>
<text x="1238" y="1491" class="body ">confianza + margen + forma</text>
<text x="1238" y="1512" class="body ">movimiento + estabilidad</text>
<rect x="1505" y="1415" width="270" height="155" rx="15" class="light"/>
<text x="1523" y="1444" class="head dark">6 · Resultado</text>
<text x="1523" y="1470" class="body dark">aceptar clase o rechazar</text>
<text x="1523" y="1491" class="body dark">show prediction / historial</text>
<text x="1523" y="1512" class="body dark">voz en navegador</text>
<path d="M340 1490L355 1490" class="line"/>
<path d="M625 1490L640 1490" class="line"/>
<path d="M910 1490L925 1490" class="line"/>
<path d="M1195 1490L1210 1490" class="line"/>
<path d="M1480 1490L1495 1490" class="line"/>
<path d="M1640 1215L1640 1405" class="limeLine"/>
<path d="M80 520H62V1490H72" class="line dashed"/>
<rect x="50" y="1670" width="1800" height="255" rx="22" class="section"/><text x="78" y="1702" class="sectionTitle">6 · DOS FLUJOS ALTERNATIVOS QUE REUTILIZAN EL SERVIDOR</text>
<rect x="80" y="1740" width="800" height="135" rx="15" class="gold"/>
<text x="98" y="1769" class="head ">Foto estática experimental · snapshot_recognition.py</text>
<text x="98" y="1795" class="body ">Toma una sola imagen; calcula descriptor de forma y distancia a referencias</text>
<text x="98" y="1816" class="body ">Calibra con validación; descarta clases sin soporte o que requieren movimiento</text>
<text x="98" y="1837" class="body ">No simula una secuencia temporal y no guarda la foto</text>
<text x="866" y="1760" text-anchor="end" class="tag">NO ES EL CLASIFICADOR TEMPORAL</text>
<rect x="1020" y="1740" width="750" height="135" rx="15" class="teal"/>
<text x="1038" y="1769" class="head ">Conversación · web_app.py + conversation.js + phone.js</text>
<text x="1038" y="1795" class="body ">Sala temporal, llave distinta para cada lado y caducidad de 1 hora</text>
<text x="1038" y="1816" class="body ">Texto/señas en memoria; acumula letras y envía tras 4 s de pausa</text>
<text x="1038" y="1837" class="body ">TTS opcional; cierra sala y cámara al terminar</text>
<path d="M210 1570L480 1730" class="line dashed"/>
<path d="M1635 1570L1390 1730" class="limeLine"/>
<rect x="50" y="1960" width="1800" height="240" rx="22" class="section"/><text x="78" y="1992" class="sectionTitle">7 · PERSISTENCIA, COMPATIBILIDAD, ADMINISTRACIÓN Y CALIDAD</text>
<rect x="80" y="2025" width="400" height="135" rx="15" class="card"/>
<text x="98" y="2054" class="head ">web_data/</text>
<text x="98" y="2080" class="body ">datasets/&lt;perfil&gt; · vocabulary/</text>
<text x="98" y="2101" class="body ">drafts · actividad · métricas · trabajos</text>
<text x="98" y="2122" class="body ">admin/ · trash/ · usuarios heredados</text>
<rect x="520" y="2025" width="400" height="135" rx="15" class="teal"/>
<text x="538" y="2054" class="head ">models/</text>
<text x="538" y="2080" class="body ">&lt;perfil&gt;/&lt;versión&gt;/model.keras</text>
<text x="538" y="2101" class="body ">metadata, etiquetas, guards y curvas</text>
<text x="538" y="2122" class="body ">current.json apunta al modelo activo</text>
<rect x="960" y="2025" width="380" height="135" rx="15" class="gold"/>
<text x="978" y="2054" class="head ">Seguridad y utilidades</text>
<text x="978" y="2080" class="body ">admin_auth.py · team_access.py</text>
<text x="978" y="2101" class="body ">private_server.py + deploy/ son heredados</text>
<text x="978" y="2122" class="body ">utils.py · rig_overlay.py</text>
<rect x="1380" y="2025" width="390" height="135" rx="15" class="light"/>
<text x="1398" y="2054" class="head dark">Pruebas, docs y legado</text>
<text x="1398" y="2080" class="body dark">tests/: captura, dataset, HTTP, ML y UI</text>
<text x="1398" y="2101" class="body dark">docs/: guías + índice de funciones</text>
<text x="1398" y="2122" class="body dark">main.py / data_collection.py: escritorio anterior</text>
<rect x="80" y="2210" width="1690" height="54" rx="15" fill="#ffffff" stroke="#333333"/>
<text x="105" y="2243" class="legend">Lectura: flechas continuas = recorrido principal · discontinuas = referencia/flujo alternativo. Para descripciones función por función, consulta docs/FUNCIONES.md.</text>
<text x="1790" y="2243" text-anchor="end" class="small">Seña · mapa del código</text>
</svg>